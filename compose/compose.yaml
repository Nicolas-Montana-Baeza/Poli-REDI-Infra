name: poliredi

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ${POSTGRES_ENV_FILE:?Define POSTGRES_ENV_FILE fuera del repositorio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    image: ${BACKEND_IMAGE:?Define BACKEND_IMAGE con una imagen validada}
    secrets:
      - source: poliredi-postgres-app-password
        target: PGPASSWORD
        type: env
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:?Define BACKEND_ENV_FILE fuera del repositorio}
    environment:
      DATABASE_URL: ""
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: poliredi
      PGUSER: poliredi_app
      PGSSLMODE: disable
      PORT: "3000"
      MVP_SCOPE: mvp2
      DEV_AUTH_ENABLED: "false"
      APP_TIMEZONE: America/Santiago
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database, frontend]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/api/health]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    image: docker.io/library/caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${FRONTEND_DIST:?Define FRONTEND_DIST con el build validado}:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [frontend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, --no-check-certificate, -q, -O, /dev/null, https://localhost:8443/healthz]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  database:
    internal: true
  frontend: {}

secrets:
  poliredi-postgres-app-password:
    external: true

volumes:
  postgres_data:
    external: true
    name: poliredi-postgres-mvp1-data
  caddy_data: {}
  caddy_config: {}
